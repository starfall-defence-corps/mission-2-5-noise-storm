services:
  # ── Fleet targets (the nodes you defend) ────────────────────────────────
  sdc-app:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sdc-app
    hostname: sdc-app
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ssh-keys/authorized_keys:/home/cadet/.ssh/authorized_keys:ro
    networks:
      fleet_net:
        ipv4_address: 172.30.0.11
    ports:
      - "2221:22"

  sdc-web:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sdc-web
    hostname: sdc-web
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ssh-keys/authorized_keys:/home/cadet/.ssh/authorized_keys:ro
    networks:
      fleet_net:
        ipv4_address: 172.30.0.12
    ports:
      - "2222:22"

  sdc-db:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sdc-db
    hostname: sdc-db
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ssh-keys/authorized_keys:/home/cadet/.ssh/authorized_keys:ro
    networks:
      fleet_net:
        ipv4_address: 172.30.0.13
    ports:
      - "2223:22"

  # ── Range infrastructure — opaque to cadets ─────────────────────────────
  # The "noise storm": a bounded probe loop that hammers the fleet's SSH and
  # web ports from a static source IP and publishes what it observes to a
  # status file. It is NOT a target — do not add it to your inventory.
  sdc-noise:
    build:
      context: .
      dockerfile: Dockerfile.noise
    container_name: sdc-noise
    hostname: sdc-noise
    restart: unless-stopped
    cap_add:
      - NET_ADMIN          # to add the secondary source IP (.21) at boot
    mem_limit: 128m
    pids_limit: 64
    volumes:
      # Attacker-authored status file, read directly by the ARIA test harness.
      # Host-side, gitignored. See scripts/setup-lab.sh (creates .lab/noise).
      - ../.lab/noise:/run/noise
    networks:
      fleet_net:
        ipv4_address: 172.30.0.20
    depends_on:
      - sdc-app
      - sdc-web
      - sdc-db

networks:
  fleet_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
